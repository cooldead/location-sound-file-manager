# Builds the AppImage for a Linux release on Ubuntu 22.04 (glibc 2.35), so it
# runs on most current distributions, and attaches it to the release.
# Runs when a vX.Y.Z-linux release is published, or by hand for a tag.
name: Linux packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.4.0-linux"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.release.tag_name, '-linux')
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries Qt links against (so PyInstaller can resolve them)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Build
        run: |
          version="${TAG#v}"
          version="${version%-linux}"
          linux/build_packages.sh "$version" --no-arch
      - name: Unit tests (from the release tarball)
        run: |
          pip install --quiet PySide6 numpy
          cd build/linux/src/location-sound-file-manager-*
          QT_QPA_PLATFORM=offscreen python -m unittest
      - name: Attach to the release
        run: gh release upload "$TAG" dist/linux/*.AppImage dist/linux/*.AppImage.sha256 --clobber
